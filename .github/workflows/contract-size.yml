name: Soroban WASM Contract Size

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-contract-size.sh"
      - ".github/workflows/contract-size.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-size:
    name: Profile Soroban WASM Sizes & Budget Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pr

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - name: Measure base WASM sizes
        if: github.event_name == 'pull_request'
        run: |
          if [[ -x base/scripts/check-contract-size.sh ]]; then
            bash base/scripts/check-contract-size.sh --output-json "${{ runner.temp }}/base-sizes.json" || true
          fi

      - name: Measure PR WASM sizes and generate diff report
        id: size-check
        run: |
          chmod +x pr/scripts/check-contract-size.sh
          BASE_ARG=""
          if [[ -f "${{ runner.temp }}/base-sizes.json" ]]; then
            BASE_ARG="--baseline ${{ runner.temp }}/base-sizes.json"
          fi
          pr/scripts/check-contract-size.sh \
            --output-json "${{ runner.temp }}/pr-sizes.json" \
            $BASE_ARG \
            --output-md "${{ runner.temp }}/size-diff.md"

      - name: Post or update PR size diff comment
        if: always() && github.event_name == 'pull_request' && hashFiles(format('{0}/size-diff.md', runner.temp)) != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/size-diff.md`, "utf8");
            const marker = "<!-- soroban-wasm-size-report -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
