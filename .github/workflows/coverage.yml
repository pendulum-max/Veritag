name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage:
    name: Rust Contracts Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: llvm-tools-preview

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build WASM release artifacts
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Generate Rust lcov coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov-rust.info

      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov-rust.info

  ts-coverage:
    name: TypeScript Workspaces Coverage (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Generate TypeScript lcov coverage reports
        run: pnpm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text

      - name: Upload TypeScript coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: "**/coverage/lcov.info"

  upload-codecov:
    name: Upload Combined Coverage to Codecov
    runs-on: ubuntu-latest
    needs: [rust-coverage, ts-coverage]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Rust coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-coverage
          path: coverage-reports/rust

      - name: Download TypeScript coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: ts-coverage
          path: coverage-reports/ts

      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-reports/rust/lcov-rust.info,coverage-reports/ts/**/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
