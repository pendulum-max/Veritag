apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-indexer
  labels:
    app.kubernetes.io/name: veritag-indexer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.indexer.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: veritag-indexer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veritag-indexer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: indexer
          image: "{{ .Values.indexer.image.repository }}:{{ .Values.indexer.image.tag }}"
          imagePullPolicy: {{ .Values.indexer.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.global.existingSecretName }}
                optional: true
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
