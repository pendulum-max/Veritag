# Override chart name (leave empty to use chart name)
nameOverride: ""
# Override fully qualified release name (leave empty to auto-generate)
fullnameOverride: ""

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Backend service
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/pendulum-max/veritag-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    STELLAR_NETWORK: "testnet"
    SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
    HORIZON_URL: "https://horizon-testnet.stellar.org"
    BACKEND_PORT: "4000"
    USE_POSTGRES_DB: "true"
    USE_S3_STORAGE: "true"
  envFromSecret: ""   # name of a K8s Secret with DATABASE_URL, JWT_SECRET, etc.

# Indexer service
indexer:
  replicaCount: 1
  image:
    repository: ghcr.io/pendulum-max/veritag-indexer
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  env:
    INDEXER_POLL_INTERVAL_MS: "5000"
    INDEXER_CONFIRMATION_LEDGERS: "2"
  envFromSecret: ""

# Web (Next.js) service
web:
  replicaCount: 2
  image:
    repository: ghcr.io/pendulum-max/veritag-web
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    NEXT_PUBLIC_API_URL: "https://api.veritag.example.com"
  envFromSecret: ""

# Ingress
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: veritag.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: api.veritag.example.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
  tls: []
  #  - secretName: veritag-tls
  #    hosts:
  #      - veritag.example.com
  #      - api.veritag.example.com

# PostgreSQL (sub-chart or external)
postgresql:
  enabled: false
  external:
    host: ""
    port: 5432
    database: veritag

# MinIO (sub-chart or external)
minio:
  enabled: false
  external:
    endpoint: ""
    bucket: veritag-files

# Common labels appended to all resources
commonLabels: {}

# Common annotations appended to all resources
commonAnnotations: {}
